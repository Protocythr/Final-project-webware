<!doctype html>

<html lang="en">
  <head>
    <title>D&D Party Tracker</title>
    <meta charset="utf-8" />

  <script src="js/main.js"></script>
  <link rel="stylesheet" href="css/main.css" />

  <!-- get rid of favicon error -->
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />

  </head>

  <body>
    <div class="container">

    <h1>D&D Party Tracker</h1>

    <section id="form-section">
      <h2>Add Character</h2>

      <form id="character-form">
        <label for="name">Name</label>
        <input type="text" id="name" required>

        <label for="class">Class</label>
        <select id="class" required>
          <option value="">Choose a class</option>
          <option>Barbarian</option>
          <option>Bard</option>
          <option>Cleric</option>
          <option>Druid</option>
          <option>Fighter</option>
          <option>Monk</option>
          <option>Paladin</option>
          <option>Ranger</option>
          <option>Rogue</option>
          <option>Sorcerer</option>
          <option>Warlock</option>
          <option>Wizard</option>
        </select>

        <label for="species">Species</label>
        <select id="species" required>
          <option value="">Choose a species</option>
          <option>Aasimar</option>
          <option>Dragonborn</option>
          <option>Dwarf</option>
          <option>Elf</option>
          <option>Gnome</option>
          <option>Goliath</option>
          <option>Halfling</option>
          <option>Human</option>
          <option>Orc</option>
          <option>Tiefling</option>
        </select>

        <label for="level">Level</label>
        <input type="number" id="level" min="1" max="20" required>

        <label for="curr-hp">Current HP</label>
        <input type="number" id="curr-hp" min="0" required>

        <label for="max-hp">Maximum HP</label>
        <input type="number" id="max-hp" min="1" required>

        <button type="submit" id="submit-button">
          Add Character
        </button>
      </form>
    </section>

    <section id="party-section">
      <h2>Party</h2>

      <table id="character-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Species</th>
            <th>Level</th>
            <th>HP</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="character-list">
        </tbody>
      </table>
    </section>

  </div>

  </body>
</html>
